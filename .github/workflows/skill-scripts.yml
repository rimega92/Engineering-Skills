name: Skill scripts

on:
  pull_request:
    paths:
      - "es/**/scripts/**"
      - "en/**/scripts/**"
      - "tests/**"
      - ".github/workflows/skill-scripts.yml"
  push:
    branches: [main]
    paths:
      - "es/**/scripts/**"
      - "en/**/scripts/**"
      - "tests/**"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Scripts are identical in es/ and en/
        run: |
          for f in $(cd es && find . -path '*/scripts/*' -type f); do
            cmp "es/$f" "en/$f"
          done
      - name: developer-contribution-analysis
        run: python -m unittest discover -s tests/developer-contribution-analysis -v
